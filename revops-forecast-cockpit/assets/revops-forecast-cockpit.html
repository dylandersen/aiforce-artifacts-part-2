:root{color-scheme:light;--ss-bg:#FFFFFF;--ss-well:#F5F6F8;--ss-ink:#0C0E11;--ss-mute:#69717D;--ss-line:#C5CBD3;--ss-accent:#0C0E11;--ss-on:#FFFFFF;--ss-ok:#0B9A68;--ss-bad:#E0453C;--ss-r:4px;--ss-font:"Red Hat Text",system-ui,sans-serif;
  --bg:#ECEEF1;--panel:#FFFFFF;--well:#F5F6F8;--ink:#0C0E11;--ink-2:#3A4049;--ink-3:#69717D;--ink-4:#A1A8B3;--line:#DCE0E5;--line-2:#C5CBD3;
  --amber:#F2A20C;--amber-ink:#8A5A00;--amber-wash:#FDF3DC;--up:#0B9A68;--down:#E0453C;
  --c-won:#0C0E11;--c-commit:#3A4049;--c-best:#7A828E;--c-pipe:#B7BDC6;
  --sans:"Red Hat Text",system-ui,sans-serif;--mono:"Red Hat Mono",ui-monospace,monospace;--ease:cubic-bezier(.23,1,.32,1)}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:13.5px/1.5 var(--sans);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--amber);outline-offset:1px}
svg.i{width:15px;height:15px;fill:currentColor;flex:none}
[hidden]{display:none!important}
.m{font-family:var(--mono);font-variant-numeric:tabular-nums}

/* Header strip */
.bar{position:sticky;top:0;z-index:10;background:var(--panel);border-bottom:1px solid var(--line)}
.bar-in{max-width:1320px;margin:0 auto;height:52px;padding:0 20px;display:flex;align-items:center;gap:14px}
.logo{display:flex;align-items:center;gap:10px;font:600 13px/1 var(--mono);letter-spacing:.06em;text-transform:uppercase}
.logo i{width:10px;height:10px;background:var(--amber);border-radius:1px}
.sp{flex:1}
.seg{position:relative;display:flex;padding:2px;border:1px solid var(--line-2);border-radius:4px;background:var(--well)}
.seg button{position:relative;z-index:1;border:0;background:none;height:26px;padding:0 10px;font:500 12px/1 var(--mono);color:var(--ink-3);transition:color .18s ease}
.seg button[aria-pressed=true]{color:var(--ink)}
.seg i{position:absolute;z-index:0;top:2px;bottom:2px;left:0;border-radius:3px;background:var(--panel);box-shadow:0 0 0 1px var(--line-2);transition:transform .3s var(--ease),width .3s var(--ease)}
.scope{position:relative}
.chip{display:inline-flex;align-items:center;gap:8px;height:32px;padding:0 10px;border:1px solid var(--line-2);border-radius:4px;background:var(--panel);font-size:12.5px;font-weight:500;transition:border-color .18s ease}
@media (hover:hover){.chip:hover{border-color:var(--ink-3)}}
.pop{position:absolute;right:0;top:40px;width:300px;padding:6px;background:var(--panel);border:1px solid var(--line-2);border-radius:6px;box-shadow:0 14px 30px -14px rgba(12,14,17,.3);transform-origin:top right;animation:pop .16s var(--ease)}
@keyframes pop{from{opacity:0;transform:scale(.97)}}
.pop input{width:100%;height:32px;border:1px solid var(--line);border-radius:4px;padding:0 10px;font:inherit;background:var(--well);outline:none}
.pop input:focus{border-color:var(--amber)}
.opts{margin-top:4px;max-height:min(420px,70vh);overflow:auto}
.opt{display:flex;align-items:center;gap:8px;width:100%;padding:7px 8px;border:0;border-radius:3px;background:none;text-align:left;font-size:12.5px}
.opt small{margin-left:auto;color:var(--ink-4);font-size:11.5px;max-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.opt[aria-checked=true]{background:var(--amber-wash);color:var(--amber-ink)}
@media (hover:hover){.opt:hover{background:var(--well)}}
.sep{height:1px;background:var(--line);margin:4px 0}
.opt-h{padding:9px 8px 3px;font:500 10px/1 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-4)}
.opt-n{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sc-l{max-width:170px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* Grid */
main{max-width:1320px;margin:0 auto;padding:16px 20px 64px;display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:12px}
.pn{background:var(--panel);border:1px solid var(--line);border-radius:4px;min-width:0;animation:in .35s var(--ease) both}
@keyframes in{from{opacity:0;transform:translateY(4px)}}
.ph{display:flex;align-items:center;gap:8px;height:40px;padding:0 14px;border-bottom:1px solid var(--line)}
.ph h2{margin:0;font:600 11.5px/1 var(--mono);letter-spacing:.08em;text-transform:uppercase}
.ph svg{color:var(--ink-3)}
.ph .r{margin-left:auto;font:500 11.5px/1 var(--mono);color:var(--ink-3)}
.pb{padding:14px}
.span-12{grid-column:span 12}.span-8{grid-column:span 8}.span-7{grid-column:span 7}.span-5{grid-column:span 5}.span-4{grid-column:span 4}

/* Forecast tiles */
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr))}
.tile{padding:16px 16px 14px;border-right:1px solid var(--line);position:relative}
.tile:last-child{border-right:0}
.tile .k{display:flex;align-items:center;gap:8px;font:500 11.5px/1 var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3)}
.tile .k b{width:8px;height:8px;border-radius:1px}
.tile .v{font:500 34px/1 var(--mono);letter-spacing:-.03em;margin-top:14px}
.tile .d{margin-top:10px;display:inline-flex;align-items:center;gap:4px;height:22px;padding:0 7px;border-radius:3px;font:600 12px/1 var(--mono)}
.d.up{background:#E3F5EE;color:var(--up)}.d.down{background:#FCE9E7;color:var(--down)}.d.flat{background:var(--well);color:var(--ink-3)}
.tile .n{font:400 11.5px/1 var(--mono);color:var(--ink-4);margin-left:8px}

/* Movement — signature */
.flows{display:flex;flex-direction:column;gap:2px}
.fl{display:grid;grid-template-columns:118px 18px 118px minmax(0,1fr) 92px 46px;align-items:center;gap:10px;height:34px;padding:0 6px;border-radius:3px;border:0;background:none;width:100%;text-align:left;transition:background-color .15s ease}
@media (hover:hover){.fl:hover{background:var(--well)}}
.fl[aria-expanded=true]{background:var(--amber-wash)}
.cat{display:inline-flex;align-items:center;gap:6px;font:500 12px/1 var(--mono);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cat b{width:8px;height:8px;border-radius:1px;flex:none}
.fl .arr{color:var(--ink-4)}
.fl .track{height:8px;background:var(--well);border-radius:1px;overflow:hidden}
.fl .track b{display:block;height:100%;transform-origin:left;animation:grow .7s var(--ease) both}
.fl .amt{font:600 13px/1 var(--mono);text-align:right}
.fl .cnt{font:400 11.5px/1 var(--mono);color:var(--ink-4);text-align:right}
.drill{margin:2px 0 8px 0;padding:6px 10px;border-left:2px solid var(--amber);background:var(--well)}
.drill div{display:flex;justify-content:space-between;gap:12px;font-size:12.5px;padding:3px 0}
.drill span:last-child{font-family:var(--mono);color:var(--ink-2);white-space:nowrap}
@keyframes grow{from{transform:scaleX(0)}}

/* Changes log */
.filters{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.fb{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 9px;border:1px solid var(--line);border-radius:3px;background:var(--panel);font:500 11.5px/1 var(--mono);color:var(--ink-3);transition:border-color .15s ease,color .15s ease}
.fb em{font-style:normal;color:var(--ink-4)}
.fb[aria-pressed=true]{border-color:var(--ink);color:var(--ink)}
.log{max-height:460px;overflow:auto;margin:0 -14px -14px;border-top:1px solid var(--line)}
.lr{display:grid;grid-template-columns:62px minmax(0,1fr) 96px minmax(0,1.1fr);gap:12px;align-items:center;padding:8px 14px;border-bottom:1px solid var(--line);font-size:12.5px}
.lr time{font:400 11.5px/1 var(--mono);color:var(--ink-4)}
.lr .dn{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lr .dn small{display:block;font-weight:400;color:var(--ink-3)}
.fld{font:600 10.5px/1 var(--mono);letter-spacing:.05em;text-transform:uppercase;color:var(--amber-ink);background:var(--amber-wash);padding:4px 6px;border-radius:2px;justify-self:start}
.ch{display:flex;align-items:center;gap:6px;font-family:var(--mono);font-size:12px;min-width:0}
.ch s{color:var(--ink-4);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ch b{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ch .up{color:var(--up)}.ch .down{color:var(--down)}

/* Hygiene */
.hy{display:grid;grid-template-columns:minmax(0,1fr) 54px 76px;gap:10px;align-items:center;width:100%;padding:9px 0;border:0;border-bottom:1px solid var(--line);background:none;text-align:left}
.hy:last-of-type{border-bottom:0}
.hy .lb{font-weight:500}
.hy .meter{grid-column:1/-1;height:3px;background:var(--well);border-radius:1px;overflow:hidden;margin-top:-2px}
.hy .meter b{display:block;height:100%;background:var(--amber);transform-origin:left;animation:grow .7s var(--ease) both}
.hy .c{font:600 15px/1 var(--mono);text-align:right}
.hy .s{font:400 12px/1 var(--mono);color:var(--ink-3);text-align:right}
.hy[aria-expanded=true] .lb{color:var(--amber-ink)}
@media (hover:hover){.hy:hover .lb{text-decoration:underline;text-underline-offset:3px;text-decoration-color:var(--line-2)}}
.score{display:flex;align-items:baseline;gap:8px;margin-bottom:6px}
.score b{font:600 40px/1 var(--mono);letter-spacing:-.03em}
.score span{font:500 11.5px/1 var(--mono);color:var(--ink-3);text-transform:uppercase;letter-spacing:.06em}

/* Stage mix */
.st{display:grid;grid-template-columns:minmax(0,170px) minmax(0,1fr) 78px;gap:10px;align-items:center;padding:6px 0;font-size:12.5px}
.st .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--ink-2)}
.st .bar2{height:14px;background:var(--well);border-radius:1px;overflow:hidden}
.st .bar2 b{display:block;height:100%;background:var(--ink-2);transform-origin:left;animation:grow .7s var(--ease) both}
.st .v{font:600 12.5px/1 var(--mono);text-align:right}

.empty{color:var(--ink-4);font-size:12.5px;padding:6px 0}
.err{padding:10px 12px;background:#FCE9E7;color:var(--down);border-radius:3px;font-size:12.5px}
.sk{background:linear-gradient(90deg,var(--line),var(--well),var(--line));background-size:200% 100%;animation:sh 1.2s linear infinite;border-radius:2px}
@keyframes sh{to{background-position:-200% 0}}
.foot{grid-column:span 12;display:flex;justify-content:space-between;font:400 11.5px/1 var(--mono);color:var(--ink-4);padding-top:4px}

@media (max-width:1100px){.span-8,.span-7,.span-5,.span-4{grid-column:span 12}}
@media (max-width:720px){.tiles{grid-template-columns:repeat(2,minmax(0,1fr))}.tile:nth-child(2){border-right:0}.tile:nth-child(-n+2){border-bottom:1px solid var(--line)}.fl{grid-template-columns:96px 14px 96px minmax(0,1fr) 72px}.fl .cnt{display:none}.lr{grid-template-columns:52px minmax(0,1fr)}.lr .fld,.lr .ch{grid-column:2}.bar-in{flex-wrap:wrap;height:auto;padding:10px 16px}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}

</style>

/* Fiscal quarters come from the org: Period records first, then the Organization's fiscal start month. Nothing is hard-coded. */
async function fiscalPeriods() {
  const r = await soql("SELECT Type, StartDate, EndDate, Number, FiscalYearSettings.Name FROM Period WHERE (Type = 'Quarter' OR Type = 'Year') AND EndDate >= TODAY ORDER BY StartDate LIMIT 8").catch(() => []);
  let q = r.filter((p) => p.Type === "Quarter").map((p) => ({ start: parseSF(p.StartDate), end: parseSF(p.EndDate), n: p.Number, fy: String(p.FiscalYearSettings?.Name || "") }));
  let y = r.filter((p) => p.Type === "Year").map((p) => ({ start: parseSF(p.StartDate), end: parseSF(p.EndDate), fy: String(p.FiscalYearSettings?.Name || "") }))[0];
  if (q.length < 2 || !y) {
    const org = (await soql("SELECT FiscalYearStartMonth, UsesStartDateAsFiscalYearName FROM Organization LIMIT 1").catch(() => []))[0] || {};
    const fm = (org.FiscalYearStartMonth || 1) - 1, today = new Date(NOW);
    let fyStartY = today.getFullYear() - (today.getMonth() < fm ? 1 : 0);
    const fyName = (sy) => String(org.UsesStartDateAsFiscalYearName || fm === 0 ? sy : sy + 1);
    const qs = [];
    for (let k = 0; k < 8; k++) { const s = new Date(fyStartY, fm + k * 3, 1), e = new Date(fyStartY, fm + k * 3 + 3, 0, 12); qs.push({ start: s.getTime(), end: e.getTime(), n: (k % 4) + 1, fy: fyName(fyStartY + Math.floor(k / 4)) }); }
    q = qs.filter((x) => x.end >= NOW - DAY);
    y = { start: new Date(fyStartY, fm, 1).getTime(), end: new Date(fyStartY, fm + 12, 0, 12).getTime(), fy: fyName(fyStartY) };
  }
  const lab = (p) => p ? `Q${p.n} FY${p.fy.slice(-2)}` : "";
  const left = (p) => p?.end ? Math.max(0, Math.ceil((p.end - NOW) / DAY)) : null;
  return {
    this: { key: "THIS_FISCAL_QUARTER", label: lab(q[0]) || "This quarter", start: q[0]?.start, end: q[0]?.end, daysLeft: left(q[0]) },
    next: { key: "NEXT_FISCAL_QUARTER", label: lab(q[1]) || "Next quarter", start: q[1]?.start, end: q[1]?.end, daysLeft: null },
    year: { key: "THIS_FISCAL_YEAR", label: y ? `FY${y.fy.slice(-2)}` : "This year", start: y?.start, end: y?.end, daysLeft: left(y) },
  };
}

      h("div", { class: "log" }, rows.length ? rows.map((x) => { const d = dir(x); return h("div", { class: "lr" }, h("time", null, rel(x.t).replace(" ago", "")), h("div", { class: "dn" }, h("a", { href: sfLink("Opportunity", x.o.Id) || "#", target: "_blank", rel: "noopener" }, x.o.Name), h("small", null, `${x.o.Owner?.Name || ""}${x.by && x.by !== x.o.Owner?.Name ? " · by " + x.by : ""}`)),
        h("span", { class: "fld" }, FIELD[x.f]), h("div", { class: "ch" }, h("s", null, fmt(x.f, x.old)), icon("right"), h("b", { class: d > 0 ? "up" : d < 0 ? "down" : "" }, fmt(x.f, x.nu)))); }) : h("div", { class: "empty", style: "padding:14px" }, "No changes.")));
  };
  $(".ph", pn).append(h("span", { class: "r" }, plural(M.log.length, "change")));
  put($(".pb", pn), body); draw();
}

function renderHygiene(pn, res, PQ, W) {
  const total = res[0][0] || { n: 0, s: 0 }, items = CONFIG.checks.map(([l, c], i) => ({ l, c, n: res[i + 1][0]?.n || 0, s: res[i + 1][0]?.s || 0 }));
  const flagged = Math.max(...items.map((x) => x.n), 0), clean = total.n ? 1 - items.reduce((a, x) => a + x.n, 0) / (total.n * items.length) : 1;
  const rows = items.map((x, i) => {
    const btn = h("button", { class: "hy", "aria-expanded": "false" }, h("span", { class: "lb" }, x.l), h("span", { class: "c" }, num(x.n)), h("span", { class: "s" }, money(x.s)), h("span", { class: "meter" }, h("b", { style: `width:${total.n ? x.n / total.n * 100 : 0}%;animation-delay:${i * 60}ms` })));
    const list = h("div", { class: "drill", hidden: true });
    btn.onclick = async () => { const o = list.hidden; list.hidden = !o; btn.setAttribute("aria-expanded", String(o)); if (o && !list.childElementCount) { list.append(h("div", { class: "sk", style: "height:12px" }));
      const r = await soql(`SELECT Id, Name, Amount, Owner.Name, CloseDate FROM Opportunity WHERE ${and(PQ, W, "IsClosed = false", x.c)} ORDER BY Amount DESC NULLS LAST LIMIT 12`).catch(() => []);
      put(list, r.length ? r.map((d) => h("div", null, h("span", null, h("a", { href: sfLink("Opportunity", d.Id) || "#", target: "_blank", rel: "noopener" }, clamp(d.Name, 54)), " · ", d.Owner?.Name || ""), h("span", null, money(d.Amount)))) : h("div", null, "None")); } };
    return [btn, list];
  });
  $(".ph", pn).append(h("span", { class: "r" }, `${plural(total.n, "open deal")}`));
  put($(".pb", pn), h("div", { class: "score" }, h("b", null, Math.round(clean * 100)), h("span", null, "Clean score")), rows);
}

function renderStages(pn, r) {
  const max = Math.max(1, ...r.map((x) => x.s || 0));
  $(".ph", pn).append(h("span", { class: "r" }, money(r.reduce((a, x) => a + (x.s || 0), 0))));
  put($(".pb", pn), r.length ? r.map((x, i) => h("div", { class: "st" }, h("span", { class: "nm", title: x.st }, String(x.st).replace(/^\s*\d+\s*[-–.]?\s*/, "")), h("span", { class: "bar2" }, h("b", { style: `width:${(x.s || 0) / max * 100}%;animation-delay:${i * 40}ms` })), h("span", { class: "v" }, money(x.s)))) : h("div", { class: "empty" }, "No open pipeline in this period."));
}

function cannedRev() {
  const { agg = [], M, per = P?.[period], hyg } = CTX, s = (f) => agg.filter(f).reduce((a, r) => a + (r.s || 0), 0), who = scope.type === "company" ? "the company" : `${scope.name}'s team`;
  const out = [];
  if (agg.length) out.push({ label: "Forecast snapshot", text: `${per.label} forecast for ${who}: ${money(s((r) => r.w))} closed · ${money(s((r) => !r.c && r.cat === "Commit"))} commit · ${money(s((r) => !r.c && r.cat === "Best Case"))} best case · ${money(s((r) => !r.c && r.cat === "Pipeline"))} pipeline.` });
  if (M?.flows?.length) out.push({ label: "What moved", text: `Forecast movement over the last ${win} days:\n${M.flows.slice(0, 4).map((f) => `• ${NAME[f.a] || f.a} → ${NAME[f.b] || f.b}: ${money(Math.abs(f.amt))} (${plural(f.n, "deal")})`).join("\n")}\nAnything here I should know about before the forecast call?` });
  if (hyg) out.push({ label: "Hygiene nudge", text: `Quick hygiene pass on ${per.label} deals, please:\n${CONFIG.checks.map(([l], i) => [l, hyg[i + 1][0]?.n || 0]).filter(([, n]) => n).map(([l, n]) => `• ${l}: ${n}`).join("\n")}\nCan you clean these up before Thursday?` });
  return out;
}
init().catch((e) => { console.error(e); put(grid, h("div", { class: "pn span-12" }, h("div", { class: "pb" }, h("div", { class: "err" }, "Salesforce didn’t respond. Reload to try again.")))); });

</script>
