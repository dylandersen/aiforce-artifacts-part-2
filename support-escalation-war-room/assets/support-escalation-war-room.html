:root{color-scheme:light;--ss-bg:#FFFFFF;--ss-well:#F2F1EE;--ss-ink:#141312;--ss-mute:#75716B;--ss-line:#E6E3DE;--ss-accent:#E1362A;--ss-on:#FFFFFF;--ss-ok:#17924A;--ss-bad:#E1362A;--ss-r:12px;--ss-font:"Albert Sans",system-ui,sans-serif;
  --bg:#F7F6F4;--panel:#FFFFFF;--well:#F2F1EE;--ink:#141312;--ink-2:#45423E;--ink-3:#75716B;--ink-4:#AAA59E;--line:#E6E3DE;--line-2:#D3CFC8;
  --red:#E1362A;--red-2:#F26B5E;--red-wash:#FDECEA;--amber:#E0860B;--amber-wash:#FDF2E1;--green:#17924A;--green-wash:#E6F4EC;
  --sans:"Albert Sans",system-ui,sans-serif;--mono:"Martian Mono",ui-monospace,monospace;--ease:cubic-bezier(.23,1,.32,1)}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:14px/1.5 var(--sans);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--red);outline-offset:2px;border-radius:4px}
svg.i{width:16px;height:16px;fill:currentColor;flex:none}
[hidden]{display:none!important}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums;letter-spacing:-.02em}

/* Header */
.hd{display:flex;align-items:center;gap:16px;padding:16px 24px;border-bottom:1px solid var(--line);background:var(--panel)}
.title{display:flex;align-items:center;gap:10px;font-weight:700;font-size:17px;letter-spacing:-.01em}
.title svg{width:22px;height:22px;color:var(--red)}
.live{display:inline-flex;align-items:center;gap:6px;font:400 11px/1 var(--mono);color:var(--ink-3)}
.live i{width:7px;height:7px;border-radius:50%;background:var(--red);animation:beat 1.6s ease-in-out infinite}
@keyframes beat{50%{opacity:.25}}
.sp{flex:1}
.seg{position:relative;display:flex;padding:3px;border-radius:999px;background:var(--well)}
.seg button{position:relative;z-index:1;border:0;background:none;height:28px;padding:0 14px;font-size:13px;font-weight:600;color:var(--ink-3);transition:color .2s ease}
.seg button[aria-pressed=true]{color:var(--ink)}
.seg i{position:absolute;z-index:0;top:3px;bottom:3px;left:0;border-radius:999px;background:var(--panel);box-shadow:0 1px 2px rgba(0,0,0,.08);transition:transform .32s var(--ease),width .32s var(--ease)}

/* Counters */
.counters{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border-bottom:1px solid var(--line);background:var(--panel)}
.ct{padding:18px 24px;border-right:1px solid var(--line)}
.ct:last-child{border-right:0}
.ct .k{display:flex;align-items:center;gap:8px;font-size:12.5px;font-weight:600;color:var(--ink-3)}
.ct .v{font:500 38px/1 var(--mono);letter-spacing:-.05em;margin-top:12px}
.ct.hot .v{color:var(--red)}
.ct.hot .k svg{color:var(--red)}

/* Pressure strip — signature */
.pressure{padding:14px 24px 16px;background:var(--panel);border-bottom:1px solid var(--line)}
.pr-h{display:flex;justify-content:space-between;font-size:12.5px;font-weight:600;color:var(--ink-3);margin-bottom:8px}
.pr{display:flex;height:34px;gap:2px;border-radius:6px;overflow:hidden}
.pr button{border:0;padding:0 10px;min-width:0;display:flex;align-items:center;color:#fff;font-size:12px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transform-origin:left;animation:grow .7s var(--ease) both;transition:filter .15s ease}
.pr button span{overflow:hidden;text-overflow:ellipsis}
@media (hover:hover){.pr button:hover{filter:brightness(1.08)}}
.pr button[aria-current=true]{box-shadow:inset 0 -3px 0 var(--ink)}
@keyframes grow{from{transform:scaleX(0)}}

/* Split */
.split{display:grid;grid-template-columns:420px minmax(0,1fr);min-height:calc(100vh - 220px)}
.queue{border-right:1px solid var(--line);background:var(--panel);overflow:auto;max-height:calc(100vh - 200px);position:sticky;top:0}
.q{display:grid;grid-template-columns:18px minmax(0,1fr) auto;gap:4px 12px;width:100%;padding:14px 20px;border:0;border-bottom:1px solid var(--line);background:none;text-align:left;position:relative;transition:background-color .15s ease;animation:in .3s var(--ease) both}
.q::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:transparent;transition:background-color .2s ease}
.q[aria-current=true]{background:var(--well)}
.q[aria-current=true]::before{background:var(--red)}
@media (hover:hover){.q:hover{background:var(--well)}}
.q .pri{padding-top:2px}
.q .pri svg{width:18px;height:18px}
.q .s{font-weight:600;font-size:14px;line-height:1.35;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.q .a{grid-column:2;font-size:12.5px;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.q .r{grid-row:1/3;grid-column:3;text-align:right;display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.q .r b{font:500 13px/1 var(--mono)}
.sla{display:inline-flex;align-items:center;gap:5px;height:22px;padding:0 8px;border-radius:999px;font:500 10.5px/1 var(--mono);white-space:nowrap}
.sla svg{width:12px;height:12px}
.sla.br{background:var(--red-wash);color:var(--red)}.sla.soon{background:var(--amber-wash);color:var(--amber)}.sla.ok{background:var(--green-wash);color:var(--green)}.sla.age{background:var(--well);color:var(--ink-3)}
@keyframes in{from{opacity:0;transform:translateY(4px)}}
.p-crit{color:var(--red)}.p-high{color:var(--amber)}.p-norm{color:var(--ink-4)}

/* Detail */
.detail{padding:28px 32px 64px;min-width:0}
.dh .meta{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;font-size:13px;color:var(--ink-3)}
.dh .meta span{display:inline-flex;align-items:center;gap:6px}
.slk{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 12px;border:1px solid var(--line-2);border-radius:999px;background:var(--panel);font-size:12.5px;font-weight:600;color:var(--ink);transition:border-color .15s ease,transform .12s ease}
.slk:active{transform:scale(.97)}
.slk svg{width:14px;height:14px;color:var(--red)}
@media (hover:hover){.slk:hover{border-color:var(--ink-3)}}
.dh h1{margin:10px 0 18px;font-size:28px;line-height:1.2;font-weight:700;letter-spacing:-.02em;text-wrap:balance;max-width:44ch}
.tags{display:flex;flex-wrap:wrap;gap:8px}
.tag{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 12px;border-radius:999px;background:var(--well);font-size:12.5px;font-weight:600;color:var(--ink-2)}
.tag.red{background:var(--red-wash);color:var(--red)}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;margin-top:24px}
.box{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:18px 20px;min-width:0;animation:in .35s var(--ease) both}
.box.wide{grid-column:1/-1}
.bx{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.bx h2{margin:0;font-size:14px;font-weight:700}
.bx svg{color:var(--ink-3)}
.bx .n{margin-left:auto;font:400 11px/1 var(--mono);color:var(--ink-4)}
.next{display:grid;grid-template-columns:28px minmax(0,1fr);gap:12px;align-items:start}
.next>svg{width:22px;height:22px;color:var(--red);margin-top:2px}
.next p{margin:0;font-size:16px;line-height:1.45;font-weight:600}
.next ul{margin:10px 0 0;padding-left:18px;color:var(--ink-2);font-size:13.5px}
.next ul li{margin:4px 0}
.ai{display:inline-flex;align-items:center;gap:6px;font:400 10px/1 var(--mono);color:var(--ink-4);text-transform:uppercase;margin-top:12px}
.ai.busy{color:var(--red)}
.ai.busy svg{animation:beat 1.1s ease-in-out infinite}
.ms{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;padding:10px 0;border-top:1px solid var(--line)}
.ms:first-of-type{border-top:0;padding-top:0}
.ms b{font-weight:600;font-size:13.5px}
.ms .t{font:500 15px/1 var(--mono);text-align:right}
.ms .t.br{color:var(--red)}.ms .t.soon{color:var(--amber)}
.ms .bar{grid-column:1/-1;height:4px;border-radius:2px;background:var(--well);overflow:hidden}
.ms .bar b{display:block;height:100%;border-radius:2px;transform-origin:left;animation:grow .8s var(--ease) both}
.money{font:500 34px/1 var(--mono);letter-spacing:-.05em}
.row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;padding:9px 0;border-top:1px solid var(--line);font-size:13.5px}
.row:first-of-type{border-top:0}
.row small{display:block;color:var(--ink-3);font-size:12px}
.row .v{font:500 13px/1.6 var(--mono);text-align:right;white-space:nowrap}
.row .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:500}
a.row{border-radius:6px}
@media (hover:hover){a.row:hover .nm{text-decoration:underline;text-underline-offset:3px}}
.msg{padding:9px 0;border-top:1px solid var(--line)}
.msg:first-of-type{border-top:0;padding-top:0}
.msg .w{display:flex;justify-content:space-between;gap:12px;font-size:12px;color:var(--ink-3)}
.msg .w b{color:var(--ink-2);font-weight:600}
.msg p{margin:3px 0 0;font-size:13.5px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.empty{color:var(--ink-4);font-size:13px}
.err{padding:12px 14px;border-radius:10px;background:var(--red-wash);color:var(--red);font-size:13px}
.calm{display:grid;place-items:center;text-align:center;padding:80px 20px;color:var(--ink-3)}
.calm svg{width:44px;height:44px;color:var(--green);margin-bottom:10px}
.sk{background:linear-gradient(90deg,var(--line),var(--well),var(--line));background-size:200% 100%;animation:sh 1.2s linear infinite;border-radius:6px}
@keyframes sh{to{background-position:-200% 0}}

@media (max-width:1000px){.split{grid-template-columns:minmax(0,1fr)}.queue{position:static;max-height:none;border-right:0}.counters{grid-template-columns:repeat(2,minmax(0,1fr))}.ct:nth-child(2){border-right:0}.ct:nth-child(-n+2){border-bottom:1px solid var(--line)}.grid2{grid-template-columns:minmax(0,1fr)}.hd{flex-wrap:wrap}.detail{padding:20px 16px 48px}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}

    return h("div", { class: "ms" }, h("b", null, m.name), h("span", { class: "t " + cls }, m.left == null ? "—" : m.breached ? `−${dur(m.left)}` : dur(m.left)),
      h("div", { class: "bar" }, h("b", { style: `width:${usedPct}%;background:${m.breached ? "var(--red)" : cls ? "var(--amber)" : "var(--green)"};animation-delay:${i * 80}ms` })));
  }) : h("div", null, h("div", { class: "money" }, age(x.created)), h("div", { class: "empty", style: "margin-top:6px" }, "Open with no SLA milestone")));
}
function renderRev(el, x, rens) {
  put(el, bx("money", L.revenue), h("div", { class: "money", style: x.risk ? "color:var(--red)" : "" }, x.risk ? money(x.risk) : "—"),
    rens.length ? h("div", { style: "margin-top:12px" }, rens.map((r) => h("a", { class: "row", href: sfLink("Opportunity", r.Id) || "#", target: "_blank", rel: "noopener" }, h("div", { style: "min-width:0" }, h("div", { class: "nm" }, r.Name), h("small", null, `${String(r.StageName).replace(/^\s*\d+\s*[-–.]?\s*/, "")} · closes ${fdate(parseSF(r.CloseDate))} · ${rel(parseSF(r.CloseDate))}`)), h("span", { class: "v" }, money(r.Amount))))) : h("div", { class: "empty", style: "margin-top:8px" }, x.risk ? "Based on revenue won in the last 12 months" : "No open renewal"));
}
function renderOthers(el, others) {
  put(el, bx("stack", L.others, others.length || null), others.length ? others.map((o) => h("a", { class: "row", href: sfLink("Case", o.Id) || "#", target: "_blank", rel: "noopener" }, h("div", { style: "min-width:0" }, h("div", { class: "nm" }, o.Subject || "Case " + o.CaseNumber), h("small", null, `#${o.CaseNumber} · ${o.Priority} · ${o.Status}`)), h("span", { class: "v" }, age(parseSF(o.CreatedDate))))) : h("div", { class: "empty" }, "This is the only open case."));
}
function renderChat(el, chat) {
  put(el, bx("slack", L.chatter, chat.length || null), chat.length ? chat.map((m) => h(m.url ? "a" : "div", { class: "msg", ...(m.url ? { href: m.url, target: "_blank", rel: "noopener" } : {}) }, h("div", { class: "w" }, h("span", null, h("b", null, m.who), " · ", m.where), h("span", null, rel(m.t))), h("p", null, m.text))) : h("div", { class: "empty" }, "No recent Slack mentions."));
}
function renderMeet(el, mt) {
  const list = [...mt].sort((a, b) => Math.abs(a.t - NOW) - Math.abs(b.t - NOW)).slice(0, 3);
  put(el, bx("cal", L.meet, list.length || null), list.length ? list.map((m) => h(m.url ? "a" : "div", { class: "row", ...(m.url ? { href: m.url, target: "_blank", rel: "noopener" } : {}) }, h("div", { style: "min-width:0" }, h("div", { class: "nm" }, m.title), h("small", null, `${plural(m.n, "attendee")}${m.ext ? ` · ${m.ext} external` : ""}`)), h("span", { class: "v" }, `${fdate(m.t)} · ${rel(m.t)}`))) : h("div", { class: "empty" }, "No meetings with this customer on your calendar."));
}

function cannedCase(x) {
  const c = x.c, w = x.sla.worst, sla = x.sla.breached ? `${w.name} SLA breached ${dur(w.left)} ago` : w?.left != null ? `${dur(w.left)} left on ${w.name.toLowerCase()}` : `open ${age(x.created)}`;
  const acct = c.Account?.Name || "the customer", rev = x.risk ? ` ${money(x.risk)} ${x.renewal ? `renewal ${fdate(x.renewal.d)}` : "account"} on the line.` : "";
  return [
    { label: "Escalation update", text: `Update on #${c.CaseNumber} (${acct}): ${c.Subject || ""}. Status ${c.Status}, ${sla}.${rev} Can you share the latest and the next customer touchpoint?` },
    { label: "Ask for help", text: `Need help on #${c.CaseNumber} for ${acct} — ${sla}.${rev} Who can take point with engineering today?` },
    { label: "Customer update", text: `Please send ${acct} an update on #${c.CaseNumber} today: where we are, what's next, and when they'll hear from us again.` },
  ];
}
init().catch((e) => { console.error(e); put($("#detail"), h("div", { class: "err" }, "Salesforce didn’t respond. Reload to try again.")); });

</script>
